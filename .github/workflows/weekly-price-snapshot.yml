name: Weekly price snapshot

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update price snapshot timestamps
        run: |
          python3 << 'PY'
          import json
          from datetime import date, timedelta

          path = 'data/hardware.json'
          with open(path) as f:
            data = json.load(f)

          today = date.today().isoformat()
          data['checked_on'] = today
          data['stale_after'] = (date.today() + timedelta(days=14)).isoformat()
          for s in data.get('systems', []):
              s['checked_on'] = today
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          print('Updated hardware.json snapshot dates')
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hardware.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: weekly price snapshot update $(date -u +%Y-%m-%d)"
            git push
          fi
